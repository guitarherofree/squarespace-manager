<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8693f"/>
      <stop offset="1" stop-color="#7c3a20"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#f6d9b4" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#f6d9b4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#c97d52"/>
      <stop offset="1" stop-color="#8e4427"/>
    </radialGradient>
    <clipPath id="globe">
      <circle cx="512" cy="512" r="262"/>
    </clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2a160b" flood-opacity="0.32"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#3a1a0c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#d08a5e" stroke-opacity="0.35" stroke-width="3"/>
  <!-- a globe drawn in cream line, like a map engraving -->
  <g filter="url(#lift)">
    <circle cx="512" cy="512" r="262" fill="url(#sphere)"/>
    <g clip-path="url(#globe)" fill="none" stroke="#f4e8d4" stroke-width="15" stroke-linecap="round">
      <ellipse cx="512" cy="512" rx="112" ry="262"/>
      <line x1="512" y1="240" x2="512" y2="784"/>
      <path d="M232 512 Q512 556 792 512"/>
      <path d="M270 372 Q512 410 754 372"/>
      <path d="M270 652 Q512 690 754 652"/>
    </g>
    <circle cx="512" cy="512" r="262" fill="none" stroke="#f4e8d4" stroke-width="20"/>
  </g>
</svg>
