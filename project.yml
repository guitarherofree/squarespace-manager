name: Website

options:
  bundleIdPrefix: com.freemanedwards
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    # Local builds only. Releases take the version from the top "## x.y.z" in CHANGELOG.md.
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  SiteKit:
    path: Packages/SiteKit
  GitHubReleaseUpdater:
    path: Packages/GitHubReleaseUpdater

targets:
  Website:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App/Sources
      - path: App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Website
        CFBundleDisplayName: Website
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: Built for Freeman Edwards.
        # The in-app updater reads releases from this repository.
        GitHubRepository: guitarherofree/squarespace-manager
    settings:
      base:
        PRODUCT_NAME: Website
        PRODUCT_MODULE_NAME: Website
        PRODUCT_BUNDLE_IDENTIFIER: com.freemanedwards.Website
        # Ad-hoc signing; no Apple Developer account.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: SiteKit
        product: SiteKit
      - package: GitHubReleaseUpdater
        product: GitHubReleaseUpdater
    scheme:
      testTargets: []
