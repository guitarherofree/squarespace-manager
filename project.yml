name: SquarespaceManager

options:
  bundleIdPrefix: com.freemanedwards
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.1"
  SiteKit:
    path: Packages/SiteKit

targets:
  SquarespaceManager:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App/Sources
      - path: App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Squarespace Manager
        CFBundleDisplayName: Squarespace Manager
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: Built for Freeman Edwards.
        # Sparkle: where updates come from and the key that must have signed them.
        SUFeedURL: https://github.com/guitarherofree/squarespace-manager/releases/latest/download/appcast.xml
        SUPublicEDKey: MxonUJCvcd0TjAql26j4favvfkCekAZAXQiD1/3NaFs=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAllowsAutomaticUpdates: true
    settings:
      base:
        PRODUCT_NAME: Squarespace Manager
        PRODUCT_MODULE_NAME: SquarespaceManager
        PRODUCT_BUNDLE_IDENTIFIER: com.freemanedwards.SquarespaceManager
        # Ad-hoc signing: no Apple Developer account. Sparkle's EdDSA signature protects updates.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: Sparkle
        product: Sparkle
      - package: SiteKit
        product: SiteKit
    scheme:
      testTargets: []
